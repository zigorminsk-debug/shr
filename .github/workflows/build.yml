name: Build SHR (Windows)

# Сборка запускается на GitHub Actions сразу после внесения изменений:
# - push в ЛЮБУЮ ветку (bare push — без фильтра, включает arena/... и теги v*)
# - любой pull request
# - вручную через Actions → Run workflow
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build SHR.exe (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pip install pytest responses
          python -m pytest tests/ -v

      - name: Build SHR.exe (PyInstaller)
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SHR src/shr/__main__.py

      - name: Upload SHR.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHR-windows-${{ github.sha }}
          path: dist/SHR.exe
          retention-days: 90

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SHR.exe
          generate_release_notes: true

  guide:
    name: Build & save full guide (Actions artifact)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble full guide (HTML page)
        run: |
          # Полный гайд — единая HTML-страница (GUIDE.html)
          mkdir -p guide
          cp GUIDE.html guide/
          # Доп-документы (не заменяют HTML-гайд, дополняют)
          cp README.md guide/ 2>/dev/null || true
          cp -r docs guide/docs 2>/dev/null || true
          ls -lh guide/ guide/docs/ 2>/dev/null

      - name: Upload guide artifact (saved in Actions)
        uses: actions/upload-artifact@v4
        with:
          name: SHR-Guide-${{ github.sha }}
          path: guide/
          retention-days: 365

name: CI

# Тесты на каждый push в любую ветку и каждый PR
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest responses
      - run: python -m pytest tests/ -v
      - run: python -m py_compile src/shr/*.py src/shr/ui/*.py

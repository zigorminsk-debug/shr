[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shr"
version = "1.0.0"
description = "SHR — Self-Hosted Runner GUI для Windows: подключение компьютера к GitHub через self-hosted runner с подтверждением каждого запроса"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SHR Team"}]
dependencies = [
    "requests>=2.31.0",
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
    "PyNaCl>=1.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "responses>=0.23.0"]

[project.scripts]
shr = "shr.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
